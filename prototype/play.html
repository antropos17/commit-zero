<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Мини-игра — Commit Zero</title>
    <link rel="icon" href="data:," />
    <script src="preview-theme.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 18px 22px 20px;
        color: var(--text);
        background: var(--surface);
        font:
          14px/1.5 Arial,
          Helvetica,
          sans-serif;
        text-align: center;
      }
      .top {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 10px;
      }
      #score {
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      canvas {
        width: 100%;
        height: 275px;
        display: block;
        border-radius: 8px;
        background: var(--soft);
      }
      button {
        display: block;
        width: 100%;
        margin-top: 18px;
        min-height: 48px;
        background: var(--emphasis);
        color: var(--on-emphasis);
        border: 0;
        border-radius: 7px;
        font:
          400 15px Arial,
          Helvetica,
          sans-serif;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 4px;
      }
      button:disabled {
        background: var(--selected);
        color: var(--muted);
        cursor: default;
      }
      p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 13px;
        min-height: 40px;
      }
      @media (max-width: 420px) {
        body {
          padding: 12px 15px;
        }
        canvas {
          height: 240px;
        }
        button {
          margin-top: 14px;
        }
        p {
          font-size: 12px;
        }
      }
    </style>
    <script src="play.js" defer></script>
  </head>
  <body>
    <div class="top">
      <span id="label">Одна кнопка</span><span id="score">Счёт: 0</span>
    </div>
    <canvas id="canvas" role="img" aria-label="Игровое поле"></canvas
    ><button id="action">Начать</button>
    <p id="message" role="status">Нажми кнопку, чтобы начать.</p>
  </body>
</html>
