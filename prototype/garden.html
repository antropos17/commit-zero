<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Orbital Garden</title>
  <script src="preview-theme.js"></script>
  <link rel="stylesheet" href="theme.css" /><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--soft);
      color: var(--text);
      font:
        14px/1.5 Arial,
        Helvetica,
        sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 21px;
      margin: 22px 0 4px;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }
    canvas {
      display: block;
      width: min(100%, 390px);
      height: 290px;
      margin: auto;
    }
    button {
      font:
        400 13px Arial,
        Helvetica,
        sans-serif;
      border: 1px solid var(--success-action);
      border-radius: 6px;
      padding: 10px 18px;
      background: var(--success-action);
      color: var(--on-colored);
      cursor: pointer;
    }
    button:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }
    .count {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
  <h1>Orbital Garden</h1>
  <p>Посади спутник. Наблюдай, как растёт маленькая система.</p>
  <canvas
    id="garden"
    width="780"
    height="580"
    aria-label="Орбиты спутников"
  ></canvas
  ><button id="plant">Добавить спутник</button
  ><span class="count" id="count" role="status">3 спутника · максимум 12</span>
  <script src="garden.js"></script>
</html>
