<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Орбита — игра с одной кнопкой</title><style>*{box-sizing:border-box}body{margin:0;background:#20221f;color:#eee9ce;font:12px Consolas,monospace;text-align:center}canvas{display:block;width:100%;height:218px}button{min-height:44px;border:1px solid #a9d5e2;border-radius:4px;background:#a9d5e2;color:#20221f;font:700 12px Consolas,monospace;padding:10px 25px;cursor:pointer}button:focus-visible{outline:3px solid #eee9ce;outline-offset:4px}p{margin:10px 12px;color:#aaa99b;line-height:1.5}.hud{position:absolute;top:14px;left:20px;font-size:11px;color:#aaa99b}.hud strong{color:#eee9ce}</style><div class="hud">Точность <strong id="score">0 / 0</strong></div><canvas id="game" aria-label="Точка движется по орбите. Остановите её в голубой зоне."></canvas><button id="action">Начать игру</button><p id="status" role="status">Останови точку в голубой зоне. Одна кнопка.</p><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),button=document.getElementById('action'),status=document.getElementById('status');let angle=-Math.PI/2,running=false,wins=0,tries=0,last=0;const target=-.65;function draw(now){const d=Math.min((now-last)/1000,.04);last=now;if(running)angle+=d*(1.4+wins*.15);const w=canvas.clientWidth,h=canvas.clientHeight,scale=window.devicePixelRatio||1;if(canvas.width!==w*scale||canvas.height!==h*scale){canvas.width=w*scale;canvas.height=h*scale}ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,w,h);const x=w/2,y=h/2+7,r=72;ctx.strokeStyle='#41473d';ctx.lineWidth=1;for(const radius of [r-22,r,r+22]){ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.stroke()}ctx.strokeStyle='#a9d5e2';ctx.lineWidth=9;ctx.beginPath();ctx.arc(x,y,r,target-.28,target+.28);ctx.stroke();ctx.fillStyle='#eee9ce';ctx.beginPath();ctx.arc(x+Math.cos(angle)*r,y+Math.sin(angle)*r,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eee9ce';ctx.font='500 26px Consolas';ctx.textAlign='center';ctx.fillText(String(wins).padStart(2,'0'),x,y+7);ctx.font='10px Consolas';ctx.fillStyle='#aaa99b';ctx.fillText('ПОПАДАНИЙ',x,y+27);if(running)requestAnimationFrame(draw)}function action(){if(!running){running=true;button.textContent='Остановить';status.textContent='Лови голубой сектор. Нажми кнопку или пробел.';last=performance.now();requestAnimationFrame(draw)}else{running=false;tries++;const delta=Math.atan2(Math.sin(angle-target),Math.cos(angle-target));const hit=Math.abs(delta)<=.28;if(hit)wins++;document.getElementById('score').textContent=wins+' / '+tries;status.textContent=hit?'Попадание! Следующая орбита быстрее.':'Мимо. Ещё одна попытка?';button.textContent='Ещё попытка';draw(performance.now())}}button.addEventListener('click',action);document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target!==button){e.preventDefault();if(!e.repeat)action()}});window.addEventListener('resize',()=>{if(!running)draw(performance.now())});draw(0);
</script></html>
